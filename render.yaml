# Render Blueprint — Finny demo (single web service: API + built web app).
# Apply it: Render dashboard → New → Blueprint → select this repo → Deploy.
services:
  - type: web
    name: finny
    runtime: node
    # starter (paid) = no idle spin-down and the disk below keeps demo data
    # across deploys. Change to "free" (and delete the disk block) for a
    # zero-cost demo that cold-starts and re-seeds itself after idling.
    plan: starter
    # --include=dev: Render sets NODE_ENV=production, but the server runs via
    # tsx and the web build needs vite — both devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    # First boot on an empty disk seeds the demo dataset (queue, learned rules,
    # dashboard history, one open alert) ONLY when SEED_DEMO=true — so a real
    # deployment starts empty. Leave SEED_DEMO unset for production.
    startCommand: bash -c 'if [ "$SEED_DEMO" = "true" ] && [ ! -f "$DATA_DIR/finny.db" ]; then npm run demo; fi; npm run start'
    healthCheckPath: /api/health
    disk:
      name: finny-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      # Who may sign in. `entra` = Microsoft 365 SSO (the team-facing deploy;
      # needs ENTRA_*/GRAPH_* too). `dev` = name/email/role picker — anyone
      # who reaches the URL can make themselves AP Lead, so the server refuses
      # to boot with it on a public URL unless ALLOW_DEV_AUTH=true is also set
      # (a throwaway SEED_DEMO sandbox only). Filled in at blueprint time.
      - key: AUTH_PROVIDER
        sync: false
      # APP_URL is derived from Render's RENDER_EXTERNAL_URL automatically.
      # When moving past the mocked demo, add: ANTHROPIC_API_KEY (Claude
      # extraction), GRAPH_* + MAIL_PROVIDER=graph (shared mailbox),
      # APPROVALS_PROVIDER=power_automate + APPROVALS_FLOW_URL/_SECRET/
      # _CALLBACK_TOKEN (Teams approvals), ALERT_WEBHOOK_URL (Teams alerts).
      # Machine tokens must be 32+ characters or the server refuses to boot.
