name: CI

# Run the same gates the Render build relies on — typecheck, tests, and a full
# production build — on every PR and every push to main, so a red check stops a
# broken merge before it can deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR branch supersedes the in-flight run. Pushes to main are
# never cancelled, so rapid back-to-back merges each keep a completed green
# check instead of leaving the intermediate merge commits showing "cancelled".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches render.yaml (NODE_VERSION 24) so CI exercises the same
          # runtime as production — node:sqlite behaviour is version-sensitive.
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Production dependencies only: a high or critical advisory in something
      # the server actually ships with fails the build. Dev-only advisories
      # (vite, vitest, concurrently) surface through Dependabot instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
